    const tl = gsap.timeline({ paused: true });
    const pings = [[0,0.96],[1,2.0],[2,3.28],[3,4.24],[5,5.28],[4,6.46],[6,6.673],[7,6.885],[8,7.098],[0,7.78],[4,8.08],[8,8.326],[2,8.528],[6,8.693],[1,8.829],[5,8.94],[3,9.031],[7,9.121],[0,9.211],[4,9.301],[8,9.391]];
    const moves = [[89.0,12.0],[4.0,12.0],[-81.0,12.0],[89.0,-73.0],[4.0,-73.0],[-81.0,-73.0],[89.0,-158.0],[4.0,-158.0],[-81.0,-158.0]];
    // Badges start hidden and pop on their card's first ping; every ping jolts the card.
    const seen = new Set();
    pings.forEach(([i, t], k) => {
      if (!seen.has(i)) {
        seen.add(i);
        tl.fromTo(`#b-badge${i}`, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, t);
      }
      tl.fromTo(`#b-jit${i}`, { rotation: 0, x: 0 }, { keyframes: [{ rotation: k % 2 ? 2.2 : -2.2, x: k % 2 ? 7 : -7, duration: 0.05 }, { rotation: k % 2 ? -1.4 : 1.4, x: k % 2 ? -4 : 4, duration: 0.06 }, { rotation: 0, x: 0, duration: 0.08 }], immediateRender: false }, t);
    });
    // Collapse (2.75 → 3.3): the headline leaves; each card flies to its tile on the cube face and becomes it.
    tl.fromTo("#b-head", { y: 0, opacity: 1 }, { y: -260, opacity: 0, duration: 0.4, ease: "power3.in" }, 9.97);
    moves.forEach(([dx, dy], i) => {
      const t0 = 10.07 + (i % 3) * 0.03 + Math.floor(i / 3) * 0.03;
      tl.fromTo(`#b-slot${i}`, { x: 0, y: 0 }, { x: dx, y: dy, duration: 0.7, ease: "power3.inOut" }, t0);
      tl.fromTo(`#b-card${i}`, { scale: 1, opacity: 1 }, { scale: 0.6875, opacity: 0, duration: 0.7, ease: "power3.inOut" }, t0);
      tl.fromTo(`#b-tile${i}`, { scale: 1.4545, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.inOut" }, t0);
    });
    // The cube face's dark backing forms under the landing tiles, so the cut into the cube is seamless.
    tl.fromTo("#b-face", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 10.47);
    // The ground floods acid from the face's centre.
    tl.fromTo("#b-flood", { clipPath: "circle(0px at 540px 900px)" }, { clipPath: "circle(1400px at 540px 900px)", duration: 0.6, ease: "power2.inOut" }, 10.72);
