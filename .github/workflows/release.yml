name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create release as draft'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is being retired: GitHub refused it ("configuration
          # 'macos-14-arm64-us-default' is not supported") on the v0.10.1 tag.
          - os: macos-15
            label: macOS (arm64)
            artifact: krnl0-macos-arm64
            ebuild_args: --mac --arm64
            asset_glob: |
              release/*.dmg
              release/*.dmg.blockmap
          # Pinned (Decision 36): windows-latest ships Visual Studio 2026
          # ("18"), which @electron/rebuild's node-gyp rejects, so node-pty
          # can't compile there. Move to windows-latest once node-gyp
          # supports it.
          - os: windows-2022
            label: Windows (x64)
            artifact: krnl0-windows-x64
            ebuild_args: --win --x64
            # latest.yml is what installed apps read to find this update —
            # it must ship with the .exe and .blockmap of the same build.
            asset_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installed apps compare versions, not files: a tag that doesn't match
      # package.json would publish a build no one is offered (or the same
      # number twice). See docs/releases/RELEASING.md.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG). Bump the version (npm version patch|minor --no-git-tag-version) and tag that."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # electron-builder downloads platform binaries during install
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Typecheck
        run: npm run typecheck

      # Suite is green on main (#145 restored after #166 merge). Tests now gate
      # the release — a failure here blocks the pipeline.
      - name: Test
        run: npm test

      - name: Build renderer + main
        run: npm run build

      # Package via electron-builder. GitHub renders unset secrets as the
      # empty string, and electron-builder treats CSC_LINK="" as "user
      # provided a cert" then errors out trying to read an empty path.
      # So we strip empty CSC vars at runtime before invoking the build.
      #
      # NOTE: do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false. That would
      # disable electron-builder's ad-hoc signing fallback on macOS, and
      # Apple Silicon (arm64) refuses to launch apps with zero signature
      # ("KRNL0.app is damaged and cant be opened"). With auto-discovery
      # left enabled and no real cert present, electron-builder falls back
      # to ad-hoc signing, which IS enough to satisfy arm64's "must have
      # SOME signature" Gatekeeper check.
      #
      # To enable real signing later, add these repo secrets:
      #   macOS: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
      #          APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
      - name: Package (electron-builder)
        shell: bash
        run: |
          set -e
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.ebuild_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Only for the release notes file (docs/releases/<tag>.md), if written.
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Pick release notes
        id: notes
        shell: bash
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lah dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.blockmap
            dist-artifacts/*.exe
            dist-artifacts/*.exe.blockmap
            dist-artifacts/latest.yml
