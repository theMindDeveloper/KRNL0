function AIBlob() {
  const { useState, useEffect, useRef } = React;
  const [open, setOpen] = useState(false);
  const [listening, setListening] = useState(false);
  const [thinking, setThinking] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [reply, setReply] = useState(null);
  const [history, setHistory] = useState([]);
  const inputRef = useRef(null);
  const [pos, setPos] = useState(() => ({
    left: 22,
    bottom: 56
  }));
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);

  // Pulse animation when listening — fake amplitude
  const [pulse, setPulse] = useState(0);
  useEffect(() => {
    if (!listening) {setPulse(0);return;}
    let raf;
    const start = performance.now();
    const tick = (t) => {
      const dt = (t - start) / 1000;
      setPulse(0.5 + 0.5 * Math.sin(dt * 5) * Math.sin(dt * 1.3));
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [listening]);

  // Drag the orb anywhere on screen
  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = e.clientX - d.sx;
      const dy = e.clientY - d.sy;
      const moved = Math.abs(dx) + Math.abs(dy);
      if (moved > 4) d.didMove = true;
      setPos({
        left: Math.max(8, Math.min(window.innerWidth - 80, d.left + dx)),
        bottom: Math.max(40, Math.min(window.innerHeight - 80, d.bottom - dy))
      });
    };
    const onUp = () => {
      const d = dragRef.current;
      if (d) {
        dragRef.current = null;
        setDragging(false);
        // If barely moved, treat as click → toggle panel
        if (!d.didMove) setOpen((o) => !o);
      }
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, []);

  const onOrbDown = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragging(true);
    dragRef.current = {
      sx: e.clientX, sy: e.clientY,
      left: pos.left, bottom: pos.bottom,
      didMove: false
    };
  };

  const toggleListen = () => {
    if (listening) {
      setListening(false);
      // Submit whatever transcript we have
      if (transcript.trim()) submit(transcript);
    } else {
      setListening(true);
      setOpen(true);
      setTranscript('');
      setReply(null);
      // Focus input so user can also type
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  };

  const submit = async (text) => {
    if (!text?.trim()) return;
    setListening(false);
    setThinking(true);
    setHistory((h) => [...h, { role: 'user', text }]);
    setTranscript('');
    try {
      const result = await window.claude.complete(
        `You are KRNL0, an AI assistant embedded in a productivity whiteboard app. ` +
        `The user is on a board with nodes: pomodoro, todos, habits, journal, terminal. ` +
        `Be terse, warm, and a bit witty. 1-2 short sentences max. No markdown. ` +
        `User: ${text}`
      );
      setReply(result);
      setHistory((h) => [...h, { role: 'ai', text: result }]);
    } catch (e) {
      setReply('connection lost. retry?');
    }
    setThinking(false);
  };

  const onSubmit = (e) => {
    e.preventDefault();
    submit(transcript);
  };

  const blobClass = [
  'ai-blob',
  listening && 'listening',
  thinking && 'thinking',
  open && 'open',
  dragging && 'dragging'].
  filter(Boolean).join(' ');

  const orbScale = 1 + (listening ? pulse * 0.18 : 0);

  return (
    <div className={blobClass} style={{ left: pos.left, bottom: pos.bottom, right: 'auto' }}>
      {/* Panel */}
      {open &&
      <div className="ai-panel">
          <div className="ai-panel-head">
            <span className="ai-name">krnl0 · assistant</span>
            <button className="ai-close" onClick={() => setOpen(false)}>×</button>
          </div>

          <div className="ai-history">
            {history.length === 0 && !thinking && !listening &&
          <div className="ai-hint">
                <div className="ai-greet">how can i help?</div>
                <div className="ai-suggest">
                  <button onClick={() => submit('what should I work on next?')}>what should i work on next</button>
                  <button onClick={() => submit('summarize my board')}>summarize my board</button>
                  <button onClick={() => submit('start a 25 minute focus session')}>start a focus session</button>
                </div>
              </div>
          }
            {history.map((m, i) =>
          <div key={i} className={`ai-msg ${m.role}`}>
                {m.role === 'user' ? '› ' : '◆ '}{m.text}
              </div>
          )}
            {thinking && <div className="ai-msg ai thinking-line">◆ <span className="dots"><span /><span /><span /></span></div>}
            {listening &&
          <div className="ai-listening">
                <span className="lis-dot" /> listening{transcript ? `: "${transcript}"` : '…'}
              </div>
          }
          </div>

          <form className="ai-form" onSubmit={onSubmit}>
            <span className="ai-prompt">›</span>
            <input
            ref={inputRef}
            value={transcript}
            onChange={(e) => setTranscript(e.target.value)}
            placeholder={listening ? 'or type instead…' : 'ask anything · ⌘+J to listen'}
            disabled={thinking} />
          
            <button type="button" className={`ai-mic ${listening ? 'on' : ''}`} onClick={toggleListen} title="listen">
              {listening ? '■' : '◉'}
            </button>
          </form>
        </div>
      }

      {/* The orb itself */}
      <button
        className="ai-orb"
        onMouseDown={onOrbDown}
        title="krnl0 assistant — drag to move"
        style={{ transform: `scale(${orbScale})` }}>
        
        <svg viewBox="0 0 80 80" className="orb-svg">
          <defs>
            <radialGradient id="orbGrad" cx="35%" cy="35%" r="70%">
              <stop offset="0%" stopColor="#f0ffb8" stopOpacity="1" />
              <stop offset="35%" stopColor="#c9f158" stopOpacity="0.95" />
              <stop offset="70%" stopColor="#7fa830" stopOpacity="0.9" />
              <stop offset="100%" stopColor="#1a2f00" stopOpacity="1" />
            </radialGradient>
            <radialGradient id="orbHi" cx="32%" cy="28%" r="22%">
              <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
              <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
            </radialGradient>
            <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="0.4" />
            </filter>
          </defs>
          {/* outer glow halos */}
          <circle cx="40" cy="40" r="38" fill="url(#orbGrad)" opacity="0.18" />
          <circle cx="40" cy="40" r="32" fill="url(#orbGrad)" opacity="0.35" />
          {/* main orb */}
          <circle cx="40" cy="40" r="26" fill="url(#orbGrad)" filter="url(#orbBlur)" />
          {/* liquid swirl — animated via CSS rotate */}
          <g className="orb-swirl">

          <ellipse cx="32" cy="30" rx="9" ry="6" fill="url(#orbHi)" />
          <circle cx="29" cy="27" r="2" fill="#ffffff" opacity="0.9" />
        </svg>
        {/* pulse rings when listening */}
        {listening &&
        <>
            <span className="orb-ring r1" />
            <span className="orb-ring r2" />
            <span className="orb-ring r3" />
          </>
        }
      </button>
    </div>);

}

// approximate node sizes for edge endpoints — updated from actual rendered sizes
// Fixed modules share a UNIFIED SIZE so the spine reads as one rigid row.
const FIXED_W = 360;
const FIXED_H = 460;
const NODE_SIZE = {
  pomodoro: { w: FIXED_W, h: FIXED_H },
  todo: { w: FIXED_W, h: FIXED_H },
  calendar: { w: FIXED_W, h: FIXED_H },
  habit: { w: FIXED_W, h: FIXED_H },
  terminal: { w: FIXED_W, h: FIXED_H },
  text: { w: 260, h: 150 },
  image: { w: 240, h: 210 },
  task: { w: 220, h: 130 }
};
// task DAG layout (anchored below todo)
const TASK_LAYER_GAP = 80; // horizontal between layers
const TASK_ROW_GAP = 28; // vertical within a layer

function getNodeSize(node) {
  const base = NODE_SIZE[node.kind] || { w: 240, h: 200 };
  return { w: node.w || base.w, h: node.h || base.h };
}

// Fixed-module spine: laid out in a horizontal row in the middle of the board.
const FIXED_ROW_GAP = 28;
const FIXED_ROW_CENTER_Y = 320;
function layoutFixedNodes(nodes) {
  const fixed = nodes.filter((n) => n.fixed).slice().sort((a, b) => a.slot - b.slot);
  const free = nodes.filter((n) => !n.fixed);
  // Force every fixed module to the same size so the spine is rigid.
  const sizes = fixed.map(() => ({ w: FIXED_W, h: FIXED_H }));
  const totalW = sizes.reduce((s, sz) => s + sz.w, 0) + FIXED_ROW_GAP * Math.max(0, fixed.length - 1);
  let cursor = -totalW / 2;
  const positioned = fixed.map((n, i) => {
    const sz = sizes[i];
    const x = cursor;
    const y = FIXED_ROW_CENTER_Y - sz.h / 2;
    cursor += sz.w + FIXED_ROW_GAP;
    return { ...n, x, y, w: FIXED_W, h: FIXED_H };
  });
  // Resolve anchored free nodes — task DAG sits below todo and follows it.
  const byId = Object.fromEntries(positioned.map((n) => [n.id, n]));
  // Group anchored tasks by layer so we can center each layer vertically.
  const anchoredTasks = free.filter((n) => n.kind === 'task' && n.anchorTo && byId[n.anchorTo] && n.layer != null);
  const layers = {};
  anchoredTasks.forEach((n) => {
    const key = n.anchorTo + ':' + n.layer;
    (layers[key] = layers[key] || []).push(n);
  });
  const resolved = free.map((n) => {
    if (n.x != null && n.y != null) return n;
    const anchor = n.anchorTo ? byId[n.anchorTo] : null;
    if (!anchor) return { ...n, x: n.x ?? 0, y: n.y ?? 0 };
    const sz = getNodeSize(n);
    const aSz = getNodeSize(anchor);
    if (n.kind === 'task' && n.layer != null) {
      const peers = layers[n.anchorTo + ':' + n.layer] || [n];
      const rows = peers.length;
      const stackH = rows * sz.h + (rows - 1) * TASK_ROW_GAP;
      const layerStartY = anchor.y + aSz.h + 90;
      const row = n.row ?? 0;
      const x = anchor.x + n.layer * (sz.w + TASK_LAYER_GAP);
      const y = layerStartY + row * (sz.h + TASK_ROW_GAP);
      return { ...n, x, y };
    }
    // Fallback to legacy anchorRow/anchorCol
    const col = n.anchorCol ?? 0,row = n.anchorRow ?? 0;
    const x = anchor.x + col * (sz.w + 30);
    const y = anchor.y + aSz.h + 80 + row * (sz.h + 30);
    return { ...n, x, y };
  });
  return [...positioned, ...resolved];
}

function Whiteboard() {
  const [nodes, setNodes] = useState(INITIAL_NODES);

  const resizeState = useRef(null);

  // --- Coordinate helpers ---
  const screenToWorld = useCallback((sx, sy) => {
    const rect = wrapRef.current.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.k,
      y: (sy - rect.top - view.y) / view.k
    };

  // --- Pan / zoom ---

  useEffect(() => {

        const newW = Math.max(rs.minW, rs.ow + rdx);
        const newH = Math.max(rs.minH, rs.oh + rdy);
        setNodes((ns) => ns.map((n) => n.id === rs.id ? { ...n, w: newW, h: newH } : n));
      }
      const ds = dragState.current;
      if (ds) {
        const dx = (e.clientX - ds.sx) / view.k;
        const dy = (e.clientY - ds.sy) / view.k;
        setNodes((ns) => ns.map((n) => n.id === ds.id ? { ...n, x: ds.nx + dx, y: ds.ny + dy } : n));
      }
      if (pendingEdge) {
        const w = screenToWorld(e.clientX, e.clientY);
        setPendingEdge((p) => p ? { ...p, x: w.x, y: w.y } : p);
      }
    };
    const onUp = (e) => {
      if (panState.current) {panState.current = null;setPanning(false);}
      if (resizeState.current) {resizeState.current = null;}
      if (dragState.current) {dragState.current = null;}
      if (pendingEdge) {
        // Try to drop on a port
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const portEl = el?.closest('.port');
        const nodeEl = portEl?.closest('.node');
        if (nodeEl && nodeEl.dataset.id !== pendingEdge.from) {
          setEdges((es) => [...es, {
            id: 'e' + Date.now(),
            from: pendingEdge.from,
            to: nodeEl.dataset.id
          }]);
        }
        setPendingEdge(null);
      }
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {window.removeEventListener('mousemove', onMove);window.removeEventListener('mouseup', onUp);};
  }, [view.k, pendingEdge, screenToWorld]);

  const onWheel = (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // pinch-zoom
      const rect = wrapRef.current.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const factor = Math.exp(-e.deltaY * 0.01);
      const newK = Math.max(0.25, Math.min(2.5, view.k * factor));
      const wx = (cx - view.x) / view.k;
      const wy = (cy - view.y) / view.k;
      setView({ k: newK, x: cx - wx * newK, y: cy - wy * newK });
    } else {
      setView((v) => ({ ...v, x: v.x - e.deltaX, y: v.y - e.deltaY }));
    }
  };

  // --- Node drag (fixed modules don't drag — use ‹ › to reorder slots) ---
  const onNodeMouseDown = (e, node) => {
    if (e.target.closest('.port')) return;
    if (e.target.closest('input, textarea, button')) return;
    if (e.target.closest('.resize-handle')) return;
    if (!e.target.closest('[data-drag-handle]')) return;
    e.stopPropagation();
    setSelected(node.id);
    if (node.fixed) return; // anchored — bail before staging a drag
    dragState.current = { id: node.id, sx: e.clientX, sy: e.clientY, nx: node.x, ny: node.y };
  };

  // --- Reorder fixed slots (left/right) ---
  const moveFixedSlot = (id, dir) => {
    setNodes((ns) => {
      const fixed = ns.filter((n) => n.fixed).slice().sort((a, b) => a.slot - b.slot);
      const idx = fixed.findIndex((n) => n.id === id);
      if (idx < 0) return ns;
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= fixed.length) return ns;
      const a = fixed[idx].slot;
      const b = fixed[swapIdx].slot;
      return ns.map((n) => n.id === fixed[idx].id ? { ...n, slot: b } :
      n.id === fixed[swapIdx].id ? { ...n, slot: a } : n);
    });
  };

  // --- Resize ---
  const onResizeDown = (e, node) => {
    e.stopPropagation();
    e.preventDefault();
    const sz = getNodeSize(node);
    const base = NODE_SIZE[node.kind] || { w: 180, h: 160 };
    resizeState.current = {
      id: node.id,
      kind: node.kind,
      sx: e.clientX, sy: e.clientY,
      ow: sz.w, oh: sz.h,
      minW: base.w * 0.6,
      minH: base.h * 0.5
    };
  };

  // --- Port drag (start connection) ---
  const onPortDown = (e, nodeId, side) => {
    e.stopPropagation();
    e.preventDefault();
    const w = screenToWorld(e.clientX, e.clientY);
    setPendingEdge({ from: nodeId, fromSide: side, x: w.x, y: w.y });
  };

  // --- Apply fixed-row layout ---
  const laidOutNodes = useMemo(() => layoutFixedNodes(nodes), [nodes]);

  // --- Edge geometry ---
  const nodeMap = useMemo(() => Object.fromEntries(laidOutNodes.map((n) => [n.id, n])), [laidOutNodes]);
  // Measure actual node DOM heights so edges land on port centres.
  // Ports are positioned at top:50% of the *rendered* node — static NODE_SIZE
  // estimates can be wrong for text/task nodes whose height depends on content.
  useLayoutEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    setMeasuredSizes(prev => {
      const next = { ...prev };
      let changed = false;
      wrap.querySelectorAll('.node[data-id]').forEach(el => {
        const id = el.dataset.id;
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        if (!prev[id] || prev[id].w !== w || prev[id].h !== h) {
          next[id] = { w, h };
          changed = true;
        }
      });
      return changed ? next : prev;
    });
  }, [laidOutNodes]);

  // Endpoints for an edge — returns {x1,y1,x2,y2} for both path + gradient.
  // Uses measured DOM sizes (with NODE_SIZE fallback) so lines land on port circles.
  const edgeEnds = useCallback((edge) => {
    const a = nodeMap[edge.from];
    const b = nodeMap[edge.to];
    if (!a || !b) return null;
    const aFb = getNodeSize(a); const bFb = getNodeSize(b);
    const am = measuredSizes[a.id];  const bm = measuredSizes[b.id];
    const aSize = { w: am?.w ?? aFb.w, h: am?.h ?? aFb.h };
    const bSize = { w: bm?.w ?? bFb.w, h: bm?.h ?? bFb.h };
    // Port centre is 1 px outside the node edge (.port.right { right:-7px } on 12 px circle)
    const PX = 1;
    // task DAG: source right port → target left port (horizontal flow)
    if (edge.kind === 'task') {
      return {
        x1: a.x + aSize.w + PX, y1: a.y + aSize.h / 2,
        x2: b.x - PX,           y2: b.y + bSize.h / 2
      };
    }
    // pomo edges: from task right → pomo left
    if (edge.kind === 'pomo') {
      return {
        x1: a.x + aSize.w + PX, y1: a.y + aSize.h / 2,
        x2: b.x - PX,           y2: b.y + bSize.h / 2
      };
    }
    // generic: pick nearest sides
    if (b.x > a.x + aSize.w / 2) {
      return {
        x1: a.x + aSize.w + PX, y1: a.y + aSize.h / 2,
        x2: b.x - PX,           y2: b.y + bSize.h / 2
      };
    }
    return {
      x1: a.x - PX,           y1: a.y + aSize.h / 2,
      x2: b.x + bSize.w + PX, y2: b.y + bSize.h / 2
    };
  }, [nodeMap, measuredSizes]);
  const edgePath = useCallback((edge) => {
    const e = edgeEnds(edge);
    if (!e) return '';
    const dx = Math.max(40, Math.abs(e.x2 - e.x1) * 0.45);
    const sign = e.x2 >= e.x1 ? 1 : -1;
    return `M ${e.x1} ${e.y1} C ${e.x1 + sign * dx} ${e.y1}, ${e.x2 - sign * dx} ${e.y2}, ${e.x2} ${e.y2}`;
  }, [edgeEnds]);

  // --- Add node from dock ---
  const addNode = (kind) => {
    const id = 'n' + Date.now();
    const center = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
    setNodes((ns) => [...ns, { id, kind, x: center.x - 100, y: center.y - 80, data: {} }]);
    setSelected(id);
  };

  // --- Spawn task node from a todo entry, chained off the last task ---
  const flashEdge = (edgeId) => {
    setFlashEdges((f) => ({ ...f, [edgeId]: true }));
    setTimeout(() => setFlashEdges((f) => {const n = { ...f };delete n[edgeId];return n;}), 1100);
  };
  const flashChainAhead = (startNodeId) => {
    // Walk forward through task edges from startNodeId, flashing each in sequence.
    setEdges((currentEdges) => {
      let cur = startNodeId;
      let step = 0;
      const visited = new Set();
      while (cur && !visited.has(cur)) {
        visited.add(cur);
        const e = currentEdges.find((ed) => ed.from === cur && (ed.kind === 'task' || nodes.find((n) => n.id === ed.to)?.kind === 'task'));
        if (!e) break;
        const eid = e.id;
        setTimeout(() => flashEdge(eid), 180 * step);
        cur = e.to;
        step++;
      }
      return currentEdges; // no mutation
    });
  };
  const addTaskFromTodo = ({ text, tag }) => {
    const id = 't-' + Date.now();
    // Anchored task DAG: find max layer + a tail to wire from.
    const anchored = nodes.filter((n) => n.kind === 'task' && n.anchorTo === 'm-todo' && n.layer != null);
    const maxLayer = anchored.length ? Math.max(...anchored.map((n) => n.layer)) : -1;
    const tailLayer = maxLayer >= 0 ? anchored.filter((n) => n.layer === maxLayer) : [];
    const newLayer = maxLayer + 1;
    const num = anchored.length + 1;
    const newNode = {
      id, kind: 'task', anchorTo: 'm-todo', layer: newLayer, row: 0,
      data: { text, tag, done: false, num, eta: '15m' }
    };
    const newEdges = tailLayer.map((t) => ({
      id: 'e-' + Date.now() + '-' + t.id,
      from: t.id, to: id, kind: 'task'
    }));
    setNodes((ns) => [...ns, newNode]);
    if (newEdges.length) {
      setEdges((es) => [...es, ...newEdges]);
      newEdges.forEach((e, i) => setTimeout(() => flashEdge(e.id), 80 * i));
    }
    setFreshNodes((f) => ({ ...f, [id]: true }));
    setTimeout(() => setFreshNodes((f) => {const n = { ...f };delete n[id];return n;}), 600);
  };

  // Spawn a pomodoro for a specific task. Multiple pomos can attach per task.
  const addPomoForTask = (taskId) => {
    const task = laidOutNodes.find((n) => n.id === taskId);
    if (!task) return;
    const sz = getNodeSize(task);
    const existing = edges.filter((e) => e.from === taskId && e.kind === 'pomo').length;
    const id = 'p-' + Date.now();
    const w = 200,h = 240;
    const x = task.x + sz.w + 60 + existing * 30;
    const y = task.y + existing * 32;
    setNodes((ns) => [...ns, { id, kind: 'pomodoro', x, y, w, h, data: { seconds: 25 * 60, running: false } }]);
    setEdges((es) => [...es, { id: 'ep-' + Date.now(), from: taskId, to: id, kind: 'pomo' }]);
    setFreshNodes((f) => ({ ...f, [id]: true }));
    setTimeout(() => setFreshNodes((f) => {const n = { ...f };delete n[id];return n;}), 600);
  };

  const toggleTaskDone = (id) => {
    setNodes((ns) => ns.map((n) => n.id === id ?
    { ...n, data: { ...n.data, done: !n.data?.done } } :
    n));
    // when a task is checked, flash the chain ahead so users see the baton pass
    const node = nodes.find((n) => n.id === id);
    if (node && !node.data?.done) flashChainAhead(id);
  };

  const removeNode = (id) => {
    setNodes((ns) => ns.filter((n) => n.id !== id));
    setEdges((es) => es.filter((e) => e.from !== id && e.to !== id));
  };

  // --- Pending edge endpoint (anchored at source port) ---
  const pendingPath = useMemo(() => {
    if (!pendingEdge) return '';
    const a = nodeMap[pendingEdge.from];
    if (!a) return '';
    const fb = getNodeSize(a);
    const m  = measuredSizes[a.id];
    const aSize = { w: m?.w ?? fb.w, h: m?.h ?? fb.h };
    const PX = 1;
    const x1 = pendingEdge.fromSide === 'right' ? a.x + aSize.w + PX : a.x - PX;
    const y1 = a.y + aSize.h / 2;
    const x2 = pendingEdge.x; const y2 = pendingEdge.y;
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.4);
    const sign = x2 >= x1 ? 1 : -1;
    return `M ${x1} ${y1} C ${x1 + sign * dx} ${y1}, ${x2 - sign * dx} ${y2}, ${x2} ${y2}`;
  }, [pendingEdge, nodeMap, measuredSizes]);

  // Reset / fit \u2014 centers the fixed-module spine in the viewport at a comfy zoom.
  const fit = useCallback(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const vw = wrap.clientWidth,vh = wrap.clientHeight;
    const fixed = laidOutNodes.filter((n) => n.fixed);
    if (!fixed.length) {setView({ x: vw / 2, y: vh / 2, k: 0.85 });return;}
    let minX = Infinity,minY = Infinity,maxX = -Infinity,maxY = -Infinity;
    fixed.forEach((n) => {
      const sz = getNodeSize(n);
      minX = Math.min(minX, n.x);minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + sz.w);maxY = Math.max(maxY, n.y + sz.h);
    });
    const padX = 120,padY = 200;
    const k = Math.min((vw - padX * 2) / (maxX - minX), (vh - padY * 2) / (maxY - minY), 0.9);
    const cx = (minX + maxX) / 2,cy = (minY + maxY) / 2;
    setView({ x: vw / 2 - cx * k, y: vh / 2 - cy * k, k });
  }, [laidOutNodes]);

  // Center on first mount once the wrap has measured.
  const didFit = useRef(false);
  useEffect(() => {
    if (didFit.current) return;
    if (!wrapRef.current) return;
    didFit.current = true;
    fit();
  }, [fit]);

  // Background grid offset
  const bgStyle = {
    backgroundPosition: `${view.x}px ${view.y}px, ${view.x}px ${view.y}px`,
    backgroundSize: `${160 * view.k}px ${160 * view.k}px, ${32 * view.k}px ${32 * view.k}px`,
    opacity: tweaks.dots === 'off' ? 0 : 1
  };

  // Tweaks: accent color, density, theme
  useEffect(() => {
    const root = document.documentElement;
    const palette = {
      acid: { acid: '#c9f158', glow: '#d8ff6e' },
      cyan: { acid: '#7fe6f0', glow: '#a8f5ff' },
      plum: { acid: '#c8a4ff', glow: '#dec0ff' }
    };
    const p = palette[tweaks.accent] || palette.acid;
    root.style.setProperty('--acid', p.acid);
    root.style.setProperty('--acid-glow', p.glow);
  }, [tweaks.accent]);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);
  useEffect(() => {
    document.documentElement.setAttribute('data-density', tweaks.density);
  }, [tweaks.density]);
  useEffect(() => {
    document.documentElement.setAttribute('data-timer', tweaks.timerStyle);
  }, [tweaks.timerStyle]);
  useEffect(() => {
    document.documentElement.setAttribute('data-vibe', tweaks.vibe);
  }, [tweaks.vibe]);
  const toggleTheme = () => setTweaks((t) => ({ ...t, theme: t.theme === 'dark' ? 'light' : 'dark' }));

  return (
    <div className="app">
      {/* Top bar */}
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">■</div>
          <div className="brand-name">KRNL<span className="dim">0</span></div>
        </div>
        <div className="crumb">
          <span>∷</span>
          <span>~/krnl0</span><span style={{ opacity: .4 }}>/</span><span>boards</span><span style={{ opacity: .4 }}>/</span><span style={{ color: 'var(--ink)' }}>deep-work</span>
          <span style={{ opacity: .4 }}>·</span>
          <span className="live">◆ live</span>
        </div>
        <div className="topbar-spacer" />
        <div className="top-actions">
          <button className="btn" onClick={fit}>FIT <span className="kbd">⇧F</span></button>
          <button className="btn" onClick={toggleTheme} title="Toggle theme">
            {tweaks.theme === 'dark' ? '☾ DARK' : '☀ LIGHT'}
          </button>
          <button className="btn" onClick={() => setTweaksOpen((o) => !o)}>
            TWEAKS
          </button>
          <button className="btn primary">SHARE</button>
        </div>
      </div>

      {/* Canvas */}
      <div
        ref={wrapRef}
        className={`canvas-wrap ${panning ? 'panning' : ''} ${pendingEdge ? 'connecting' : ''}`}
        onMouseDown={onWrapMouseDown}
        onWheel={onWheel}>
        
        <div className="canvas-bg" style={bgStyle} />
        <div className="canvas" style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.k})` }}>
          <svg className="connections" style={{ overflow: 'visible' }}>
            <defs>
              {edges.filter((e) => e.kind === 'task').map((edge) => {
                const ee = edgeEnds(edge);
                if (!ee) return null;
                return (
                  <linearGradient key={'g-' + edge.id} id={'g-' + edge.id} gradientUnits="userSpaceOnUse"
                  x1={ee.x1} y1={ee.y1} x2={ee.x2} y2={ee.y2}>
                    <stop offset="0%" stopColor="#1b5b63" stopOpacity="0.55" />
                    <stop offset="45%" stopColor="#4ea8b0" stopOpacity="0.95" />
                    <stop offset="100%" stopColor="#a5edf6" stopOpacity="1" />
                  </linearGradient>);

              })}
            </defs>
            {edges.map((edge) => {
              const cls = [];
              if (edge.kind === 'task') cls.push('task-edge');
              if (edge.kind === 'pomo') cls.push('pomo-edge');
              if (flashEdges[edge.id]) cls.push('flashing');
              if (edge.active) cls.push('active');
              const style = edge.kind === 'task' ? { stroke: `url(#g-${edge.id})` } : undefined;
              return (
                <path
                  key={edge.id}
                  d={edgePath(edge)}
                  className={cls.join(' ')}
                  style={style} />);


            })}
            {pendingEdge && <path d={pendingPath} className="pending" />}
          </svg>
          {laidOutNodes.map((node) => {
            const fixedSiblings = laidOutNodes.filter((n) => n.fixed).sort((a, b) => a.slot - b.slot);
            const fixedIdx = node.fixed ? fixedSiblings.findIndex((n) => n.id === node.id) : -1;
            const isFreshTask = !!freshNodes[node.id];
            return (
              <div
                key={node.id}
                data-id={node.id}
                className={`node ${node.kind} ${selected === node.id ? 'selected' : ''} ${node.fixed ? 'fixed' : ''} ${node.data?.done ? 'done' : ''} ${isFreshTask ? 'fresh' : ''}`}
                style={{ left: node.x, top: node.y, width: node.w || undefined, height: node.h || undefined }}
                onMouseDown={(e) => onNodeMouseDown(e, node)}
                onClick={(e) => {e.stopPropagation();setSelected(node.id);}}>
                
                {node.fixed &&
                <>
                    <div className="fixed-corners"><span className="tl" /><span className="tr" /><span className="bl" /><span className="br" /></div>
                    <div className="fixed-slot-tag"><span className="num">{String(fixedIdx + 1).padStart(2, '0')}</span> · spine · {String(fixedSiblings.length).padStart(2, '0')}</div>
                    <button className="fixed-reorder left" disabled={fixedIdx <= 0}
                  onClick={(e) => {e.stopPropagation();moveFixedSlot(node.id, -1);}}
                  title="move left">‹</button>
                    <button className="fixed-reorder right" disabled={fixedIdx >= fixedSiblings.length - 1}
                  onClick={(e) => {e.stopPropagation();moveFixedSlot(node.id, +1);}}
                  title="move right">›</button>
                  </>
                }
                <NodeBody
                  node={node}
                  onPortDown={node.fixed && node.kind !== 'todo' ? null : onPortDown}
                  onAddTask={node.kind === 'todo' ? addTaskFromTodo : null}
                  onToggleDone={node.kind === 'task' ? () => toggleTaskDone(node.id) : null}
                  onSpawnPomo={node.kind === 'task' ? () => addPomoForTask(node.id) : null}
                  pomoCount={node.kind === 'task' ? edges.filter((e) => e.from === node.id && e.kind === 'pomo').length : 0} />
                
                {selected === node.id && !node.fixed &&
                <div className="resize-handle" onMouseDown={(e) => onResizeDown(e, node)} />
                }
              </div>);

          })}
        </div>
      </div>

      {/* Left dock */}
      <div className="dock">
        <button className={`dock-btn ${tool === 'select' ? 'active' : ''}`} data-tip="Select · V" onClick={() => setTool('select')}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 3l14 9-7 1-3 7L5 3z" /></svg>
        </button>
        <div className="dock-divider" />
        <button className="dock-btn" data-tip="Text note" onClick={() => addNode('text')}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 4h14M12 4v16M8 20h8" /></svg>
        </button>
        <button className="dock-btn" data-tip="Image / ASCII" onClick={() => addNode('image')}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="4" width="18" height="16" rx="1" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-9 9" /></svg>
        </button>
        <div className="dock-divider" />
        <button className="dock-btn" data-tip="Connect">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="6" cy="12" r="2" /><circle cx="18" cy="12" r="2" /><path d="M8 12h8" /></svg>
        </button>
      </div>

      {/* Tweaks */}
      <div className={`tweaks ${tweaksOpen ? 'open' : ''}`}>
        <div className="tweaks-head">
          <span>tweaks · /board</span>
          <button className="x" onClick={() => setTweaksOpen(false)}>×</button>
        </div>
        <div className="tweaks-body">
          <div className="tweak-row">
            <div className="label">vibe</div>
            <div className="opts">
              {['cyber', 'paper', 'noir', 'solar'].map((v) =>
              <button key={v} className={`tweak-opt ${tweaks.vibe === v ? 'active' : ''}`}
              onClick={() => setTweaks((s) => ({ ...s, vibe: v }))}>{v}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label">timer</div>
            <div className="opts">
              {['ring', 'ascii', 'lcd', 'blocks', 'vapor'].map((t) =>
              <button key={t} className={`tweak-opt ${tweaks.timerStyle === t ? 'active' : ''}`}
              onClick={() => setTweaks((s) => ({ ...s, timerStyle: t }))}>{t}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label">theme</div>
            <div className="opts">
              {['light', 'dark'].map((t) =>
              <button key={t} className={`tweak-opt ${tweaks.theme === t ? 'active' : ''}`}
              onClick={() => setTweaks((s) => ({ ...s, theme: t }))}>{t}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label">accent</div>
            <div className="opts">
              {['acid', 'cyan', 'plum'].map((a) =>
              <button key={a} className={`tweak-opt ${tweaks.accent === a ? 'active' : ''}`}
              onClick={() => setTweaks((t) => ({ ...t, accent: a }))}>{a}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label">density</div>
            <div className="opts">
              {['compact', 'comfy', 'spacious'].map((d) =>
              <button key={d} className={`tweak-opt ${tweaks.density === d ? 'active' : ''}`}
              onClick={() => setTweaks((t) => ({ ...t, density: d }))}>{d}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label">grid dots</div>
            <div className="opts">
              {['on', 'off'].map((d) =>
              <button key={d} className={`tweak-opt ${tweaks.dots === d ? 'active' : ''}`}
              onClick={() => setTweaks((t) => ({ ...t, dots: d }))}>{d}</button>
              )}
            </div>
          </div>
          <div className="tweak-row">
            <div className="label" style={{ marginTop: 4, color: 'var(--ink-4)', fontSize: 9.5, lineHeight: 1.5 }}>
              drag from any port (●) to connect nodes ·<br />
              ⌘/ctrl + scroll to zoom · drag canvas to pan
            </div>
          </div>
        </div>
      </div>

      {/* Minimap */}
      <div className="minimap">
        <div className="minimap-label">map</div>
        <div className="minimap-canvas">
          {laidOutNodes.map((n) => {
            const sz = getNodeSize(n);
            return (
              <div key={n.id}
              className={`minimap-node ${n.kind} ${n.fixed ? 'fixed' : ''}`}
              style={{
                left: 100 + n.x * 0.06,
                top: 30 + n.y * 0.06,
                width: sz.w * 0.06,
                height: sz.h * 0.06
              }} />);


          })}
        </div>
      </div>

      {/* AI Assistant Blob */}
      <AIBlob />

      {/* Status bar */}
      <div className="statusbar">
        <div className="status-item"><span className="label">workspace</span><span className="val">~/krnl0/deep-work</span></div>
        <div className="status-item acid"><span className="label">claude</span><span className="val">● connected</span></div>
        <div className="status-item rust"><span className="label">pomo</span><span className="val">18:42 / 25:00</span></div>
        <div className="status-item"><span className="label">nodes</span><span className="val">{nodes.length}</span></div>
        <div className="status-item"><span className="label">edges</span><span className="val">{edges.length}</span></div>
        <div className="status-spacer" />
        <div className="status-item"><span className="label">zoom</span><span className="val">{Math.round(view.k * 100)}%</span></div>
        <div className="status-item"><span className="label">v0.1.0</span></div>
      </div>

      <div className="hint">
        <span>drag from <span style={{ color: 'var(--acid)' }}>●</span> ports to connect</span>
        <span><span className="kbd">⌘</span> + scroll to zoom</span>
        <span>click <span className="kbd">+</span> in dock to add a node</span>
      </div>
    </div>);

}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Whiteboard />);
</script></body></html>
